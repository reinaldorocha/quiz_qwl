# Configuração local do Supabase CLI — ADQuiz
# Documentação: https://supabase.com/docs/guides/cli/config

project_id = "adquiz"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Webhooks de entrada das plataformas de venda.
# verify_jwt = false é obrigatório: quem chama é a plataforma externa, que não
# tem JWT do Supabase. A autenticação é o token na URL.
[functions.webhook-in]
verify_jwt = false
